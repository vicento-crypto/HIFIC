<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fuego Calendario (nombre provisional)</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <header class="barra-superior">
      <div class="marca">
        <h1>Fuego Calendario</h1>
        <p>¿Es este mes normal para esta zona?</p>
      </div>
      <div class="fuente-datos">
        <span id="aviso-prueba" class="etiqueta-prueba" hidden>DATOS DE PRUEBA</span>
        <span>Datos: NASA FIRMS (MODIS + VIIRS)</span>
      </div>
    </header>
    <main class="aplicacion">
      <p id="aviso-filas" class="aviso-filas" role="status" hidden></p>
      <section class="mapa-fondo">
        <div id="mapa" aria-label="Mapa de República Dominicana"></div>
        <button id="mostrar-calendario" class="boton-principal boton-mapa" type="button">Ver calendario de RD</button>
        <p id="error-mapa" class="error-mapa" role="alert"></p>
        <p class="nota-mapa">Mapa en construcción</p>
        <footer class="creditos">Contorno: geoBoundaries (geoboundaries.org), CC BY 4.0. Mapa base: © OpenStreetMap</footer>
      </section>
      <aside id="contenido-calendario" class="panel-lateral" hidden>
        <button id="ocultar-calendario" class="boton-cerrar" type="button">Cerrar calendario</button>
        <section id="comparacion" class="comparacion" aria-live="polite" hidden>
          <h2 id="comparacion-titulo"></h2>
          <p id="comparacion-prueba" class="comparacion-prueba" hidden>DATOS DE PRUEBA</p>
          <p id="comparacion-valor"></p>
          <p id="comparacion-mediana"></p>
          <p id="comparacion-mensaje"></p>
        </section>
        <div class="filtros-anios">
          <label>Desde año <select id="desde-anio"></select></label>
          <label>Hasta año <select id="hasta-anio"></select></label>
          <button id="descargar-csv" type="button">Descargar CSV</button>
        </div>
        <p id="mensaje-rango" role="status" hidden></p>
        <div id="calendario" role="img" aria-label="Calendario de focos por mes y año"></div>
      </aside>
      <p id="error" role="alert"></p>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
